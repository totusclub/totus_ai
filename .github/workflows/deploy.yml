# Проверки на каждый PR и выкладка Милы на сервер после слияния в main.
# Как устроено и как включить — docs/AVTODEPLOY.md.
# Выкладка включается переменной репозитория DEPLOY_ENABLED=true; пока её нет —
# только проверки.
name: Проверки и выкладка

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      action:
        description: 'deploy — выложить последний main; rollback — вернуть прошлый релиз; status — что на проде'
        type: choice
        options: [deploy, rollback, status]
        default: status

# Выкладки идут строго по очереди, проверки PR — каждая своя.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.number) || 'production' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    name: Проверки
    if: github.event_name != 'workflow_dispatch' || inputs.action == 'deploy'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20 # как на сервере
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: npm run check (поведение Милы, защита данных, тон, тест выкладки)
        run: npm run check
      - name: Типы сервера
        run: npm run typecheck:server
      - name: Сборка
        run: npm run build

  deploy:
    name: Выкладка на сервер
    needs: check
    if: >-
      always() &&
      vars.DEPLOY_ENABLED == 'true' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      (needs.check.result == 'success' || (needs.check.result == 'skipped' && inputs.action != 'deploy'))
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      # Каждая причина сбоя — отдельной понятной ошибкой (::error::): её видно
      # в сводке запуска и через API, без открытия полного лога.
      - name: Проверка настроек выкладки
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
        run: |
          fail=0
          err() { echo "::error title=$1::$2"; fail=1; }
          [ -n "$DEPLOY_HOST" ] || err "Нет DEPLOY_HOST" "Settings → Secrets and variables → Actions → Variables: DEPLOY_HOST = 109.73.206.121"
          [ -n "$DEPLOY_SSH_KEY" ] || err "Нет DEPLOY_SSH_KEY" "Secrets: закрытый ключ из вывода deploy/setup-server.sh, целиком со строками BEGIN/END"
          [ -n "$DEPLOY_KNOWN_HOSTS" ] || err "Нет DEPLOY_KNOWN_HOSTS" "Secrets: строки «109.73.206.121 ssh-…» из вывода deploy/check-server.sh"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          if [ -n "$DEPLOY_SSH_KEY" ]; then
            if pub="$(ssh-keygen -y -f ~/.ssh/deploy_key 2>/dev/null)"; then
              echo "Ключ выкладки: $(printf '%s\n' "$pub" | ssh-keygen -lf - | cut -d' ' -f1-2) — должен совпасть с отпечатком в deploy/check-server.sh"
            else
              err "DEPLOY_SSH_KEY не читается" "скопируйте закрытый ключ заново целиком, вместе со строками -----BEGIN/END OPENSSH PRIVATE KEY-----"
            fi
          fi
          if [ -n "$DEPLOY_HOST" ] && [ -n "$DEPLOY_KNOWN_HOSTS" ]; then
            ssh-keygen -F "$DEPLOY_HOST" -f ~/.ssh/known_hosts >/dev/null \
              || err "В DEPLOY_KNOWN_HOSTS нет сервера $DEPLOY_HOST" "строки должны начинаться с «$DEPLOY_HOST ssh-…» — возьмите их из вывода deploy/check-server.sh"
          fi
          if [ -n "$DEPLOY_HOST" ]; then
            if timeout 15 bash -c "</dev/tcp/$DEPLOY_HOST/22" 2>/dev/null; then
              echo "Порт 22 на $DEPLOY_HOST доступен из GitHub"
            else
              err "GitHub не может подключиться к $DEPLOY_HOST:22" "сервер не пускает облачные машины GitHub (фильтр, файрвол, хостинг) — тогда включаем запасной вариант: сервер сам проверяет GitHub"
            fi
          fi
          exit $fail
      - name: Команда на сервер
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          ACTION: ${{ github.event_name == 'push' && 'deploy' || inputs.action }}
        run: |
          case "$ACTION" in
            deploy) CMD="deploy $GITHUB_SHA" ;;
            rollback|status) CMD="$ACTION" ;;
            *) echo "неизвестное действие $ACTION"; exit 2 ;;
          esac
          echo "→ $CMD"
          set +e
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o BatchMode=yes \
              -o ConnectTimeout=20 -o ServerAliveInterval=30 -o ServerAliveCountMax=10 \
              "root@$DEPLOY_HOST" "$CMD" > >(tee /tmp/out.txt) 2> >(tee /tmp/err.txt >&2)
          code=$?
          sleep 1
          if [ "$code" = 255 ]; then
            msg="$(grep -v '^[[:space:]]*$' /tmp/err.txt | tail -n 3 | tr '\n' ' ')"
            case "$msg" in
              *"Host key verification failed"*|*"REMOTE HOST IDENTIFICATION"*) hint="DEPLOY_KNOWN_HOSTS не совпадает с ключом сервера — возьмите строки из deploy/check-server.sh" ;;
              *"Permission denied"*) hint="сервер не принял ключ: открытая часть DEPLOY_SSH_KEY должна быть в /root/.ssh/authorized_keys (сверьте отпечатки в этом шаге и в deploy/check-server.sh)" ;;
              *"timed out"*|*"Connection refused"*|*"No route"*) hint="нет связи с сервером по SSH из GitHub — запасной вариант: сервер сам проверяет GitHub" ;;
              *) hint="см. полный лог шага" ;;
            esac
            echo "::error title=SSH: не удалось зайти на сервер::$msg → $hint"
          elif [ "$code" != 0 ]; then
            reason="$(grep 'ОШИБКА' /tmp/out.txt | tail -n 1)"
            echo "::error title=Выкладка на сервере не удалась (код $code)::${reason:-см. лог шага и /srv/totus/ai/deploy.log}"
          fi
          exit "$code"
